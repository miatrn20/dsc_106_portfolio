
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Mia Tran</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <main>
        <header class="page-header">
            <p class="eyebrow">Let’s connect</p>
            <h1>Contact</h1>
            <p class="lede">Send me a message about data, projects, or opportunities.</p>
        </header>

        <form action="mailto:nnt003@ucsd.edu"
              method="POST"
              enctype="text/plain">
            <label>
                Your email
                <input
                    type="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required>
            </label>

            <label>
                Subject
                <input
                    name="subject"
                    placeholder="What would you like to discuss?"
                    required>
            </label>

            <label>
                Message
                <textarea
                    name="body"
                    rows="7"
                    placeholder="Write your message here…"
                    required></textarea>
            </label>

            <button type="submit">Send message</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Anh (Mia) Tran</p>
    </footer>
</body>
</html>
